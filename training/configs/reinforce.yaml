# REINFORCE (custom) hyperparameter grid. NOT run in full by the assistant
# that scaffolded this project -- only `--smoke` runs were executed.
#
# Tiered budgets (Phase 3): see dqn.yaml / ppo.yaml for the rationale. Note
# REINFORCE runs single-env only (n_envs is ignored, see
# training/pg_training.py::train_reinforce), so it will be the slowest of
# the four per-timestep on wall clock -- budget accordingly.
grid_timesteps: 50000
headline_timesteps: 200000
seeds: [0, 1]

grid:
  learning_rate: [1.0e-3, 3.0e-4, 1.0e-4]  # NOTE: must have a decimal point -- PyYAML's safe_load parses bare "1e-3" as a STRING, not a float
  gamma: [0.99]
  use_baseline: [true, false]
  entropy_coef: [0.0, 0.01]
  net_arch:
    - [64, 64]
