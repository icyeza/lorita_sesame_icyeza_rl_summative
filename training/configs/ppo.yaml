# PPO hyperparameter grid. NOT run in full by the assistant that scaffolded
# this project -- only `--smoke` runs were executed.
#
# Tiered budgets (Phase 3): grid_timesteps is a SHORT budget used for every
# cell in the grid below, sized to show differentiated behavior across
# hyperparameters without costing a full training run per cell (~16 cells x
# 2 seeds = 32 runs -- at grid_timesteps this is feasible in a reasonable
# multi-day window; at headline_timesteps it would not be). headline_timesteps
# is reserved for a handful of best-config runs (see training/sweep.py
# --budget headline) meant to produce the report's clean learning curves.
grid_timesteps: 50000
headline_timesteps: 200000
seeds: [0, 1]

grid:
  learning_rate: [3.0e-4, 1.0e-4]  # NOTE: must have a decimal point -- PyYAML's safe_load parses bare "3e-4" as a STRING, not a float
  gamma: [0.99]
  n_steps: [128, 256]
  gae_lambda: [0.95]
  entropy_coef: [0.0, 0.01]
  clip_range: [0.1, 0.2]
  net_arch:
    - [64, 64]
